apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    lbipam.cilium.io/ips: "192.168.11.154"
spec:
  ingressClassName: "cilium"
  rules:
    - host: "homepage.nguyenvietkhoi.io.vn"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
  tls:
    - hosts:
        - "homepage.nguyenvietkhoi.io.vn"
      secretName: homepage-ui-certificate-secret